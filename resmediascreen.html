<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .container{
        display: flex;
        gap: 1rem;
        margin: 1rem;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
    }
    .box{
        width: 100px;
        height: 100px;
        border-radius: 10px;
        background-color: darkorchid;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        color: aliceblue;
    }

    @media (min-width: 600px) {
    .box {
        width: 100%;
    }
}
    @media (min-width: 300px) {
    .box {
        width: 48%;
    }
}






@media  (min-width: 1024px) {
    .box {
        width: 23%; 
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
    </div>
</body>
</html>
